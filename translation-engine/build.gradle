plugins { id 'com.android.application' }
android {
    namespace 'com.ajadi.keys.translation'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ajadi.keys.translation'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.6.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.java.srcDirs += ['../shared/src/main/java', '../engine-shared/src/main/java']
    splits {
        abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'; universalApk true }
    }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    testImplementation 'junit:junit:4.13.2'
}
