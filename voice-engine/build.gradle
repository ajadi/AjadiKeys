plugins { id 'com.android.application' }
android {
    namespace 'com.ajadi.keys.voice'
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig {
        applicationId 'com.ajadi.keys.voice'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.6.0'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.java.srcDirs += ['../shared/src/main/java', '../engine-shared/src/main/java']
    splits {
        abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'; universalApk true }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
