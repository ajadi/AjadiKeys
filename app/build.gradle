plugins { id 'com.android.application' }

android {
    namespace 'com.ajadi.keys'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ajadi.keys'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.10.5'
    }
    sourceSets.main.java.srcDirs += ['../shared/src/main/java']
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.autofill:autofill:1.3.0'
    testImplementation 'junit:junit:4.13.2'
}
